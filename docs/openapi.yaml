openapi: 3.0.3
info:
  title: T17 Semantic Source Code Analysis API
  version: 1.0.0
  description: Minimal REST API for the T17 PCD project. The main application uses TCP and UNIX sockets, while this REST API exposes project status, reports, jobs, users and logs.

servers:
  - url: http://127.0.0.1:8081
    description: Local REST API server

paths:
  /:
    get:
      summary: List available REST endpoints
      responses:
        "200":
          description: API endpoint list

  /health:
    get:
      summary: Check REST API health
      responses:
        "200":
          description: REST API is running

  /stats:
    get:
      summary: Get server statistics
      responses:
        "200":
          description: Returns analyzed file count and last analyzed file

  /reports:
    get:
      summary: List generated reports
      responses:
        "200":
          description: Returns files from the reports directory

  /reports/{name}:
    get:
      summary: Get report content
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Report filename
      responses:
        "200":
          description: Report content
        "404":
          description: Report not found

  /uploads:
    get:
      summary: List uploaded files
      responses:
        "200":
          description: Returns files from the uploads directory

  /jobs:
    get:
      summary: List analysis jobs
      responses:
        "200":
          description: Returns job history from logs/jobs.log

  /users:
    get:
      summary: List configured users without passwords
      responses:
        "200":
          description: Returns usernames and roles from config/users.cfg

  /logs:
    get:
      summary: Show recent server logs
      responses:
        "200":
          description: Returns recent lines from logs/server.log

  /ui:
    get:
      summary: Simple browser UI for the REST API
      responses:
        "200":
          description: HTML page with buttons for REST endpoints